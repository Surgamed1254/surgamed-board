<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SurgaMed · CRM</title>
<style>
  :root{--bg:#f4f6f9;--panel:#fff;--ink:#1d2733;--muted:#647387;--line:#e3e8ef;--blue:#185fa5;--blueS:#e8f1fb;--green:#1b9e6b;--greenS:#e6f6ee;--amber:#b7791f;--amberS:#fdf3e2;--red:#c0392b;--redS:#fdecea;--purple:#6b46c1;--purpleS:#efe9fb;--teal:#0f766e;--tealS:#d9f2ee;--shadow:0 1px 3px rgba(16,24,40,.1)}

  header.top{background:var(--panel);border-bottom:1px solid var(--line);padding:9px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}

  .badge{font-size:11px;font-weight:600;border-radius:999px;padding:2px 10px}

  .who{color:var(--muted);font-size:12px}

  .lcount{padding:6px 13px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}

  .row .r2{margin-top:5px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .src{display:inline-block;font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px;letter-spacing:.2px}
  .src.WhatsApp{background:var(--greenS);color:var(--green)} .src.Email{background:var(--blueS);color:var(--blue)}

  .toast.show{opacity:1}
  /* email / shipping / purchases tables */
  .phtab{width:100%;border-collapse:collapse;font-size:12px}

  .ws-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:14px}
  .ws-kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
  .ws-kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .ws-kpi .val{font-size:24px;font-weight:700;margin-top:3px}

  .ws-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}

  .ws-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 15px;box-shadow:var(--shadow)}
  .ws-card h3{margin:0 0 10px;font-size:13px}
  .ws-stage{display:flex;align-items:center;gap:9px;margin:6px 0;cursor:pointer}

  .ws-stage .bar i{display:block;height:100%}
  .ws-stage .ct{width:34px;text-align:right;font-weight:700;font-size:12px}
  .ws-reptab{width:100%;border-collapse:collapse;font-size:12px}
  .ws-reptab th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:5px 6px}
  .ws-reptab td{border-bottom:1px solid var(--line);padding:6px;cursor:pointer}
  .ws-reptab tr:hover td{background:#f8fafc}
  .ws-cap{color:var(--muted);font-size:11px;margin-top:7px}
#hoursModal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:1000;display:flex;align-items:center;justify-content:center}

#waTransChip{cursor:pointer;user-select:none}
#waTransChip.on{background:#e7f0ff;border-color:#2563eb;color:#2563eb}
.ai-nextbox{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px 12px;font-size:12.5px;margin:8px 0;color:#374151}
.ai-nextbox .ai-next{color:#1d4ed8}
.ai-flag{background:#fde68a;color:#92400e;font-weight:700;border-radius:999px;padding:1px 8px;font-size:11px}
</style>
</head>

<script>
const SB_URL="https://ecjemcrpbzeocoiwslcu.supabase.co";
const SB_KEY="sb_publishable_GhYb1dkRQKdH5oimsnhaYA_A8QYT3Yq";
const MANAGER_FN=SB_URL+"/functions/v1/manager";
const WA_FN=SB_URL+"/functions/v1/whatsapp/send";
const FN_URL=SB_URL+"/functions/v1/leads";   // shared mailbox/shipping/send function (same as dotMed board)
const MANAGERS=["mweinreb@surgamed.com","sgluck@surgamed.com","orders@surgamed.com"];
const REPS={"jlugo@surgamed.com":"Jennifer Lugo","dcalvo@surgamed.com":"Deysi Calvo","tcohen@surgamed.com":"Tehila Cohen","malejo@surgamed.com":"Mirian Alejo"};
const STATUSES=[["new","New"],["in_progress","In progress"],["quoted","Quoted"],["awaiting_customer","Awaiting customer"],["won","Won"],["lost","Lost"],["closed","Closed"]];
const STATUS_COLOR={new:"#185fa5",in_progress:"#2563eb",quoted:"#6b46c1",awaiting_customer:"#647387",won:"#1b9e6b",lost:"#c0392b",closed:"#1b9e6b"};
const PRIORITIES=[["urgent","Urgent"],["high","High"],["normal","Normal"],["low","Low"]];
const statusName=s=>(STATUSES.find(x=>x[0]===s)||[,s||"New"])[1];
const TLICON={whatsapp_in:"💬",whatsapp_out:"📤",customer_created:"✨",note:"📝",order:"📦",payment:"💳",shipment:"🚚",email:"✉️",dotmed:"🩺",ai_summary:"🤖"};
function badgeFor(ev){ const s=(ev.source||"").toLowerCase(), t=(ev.type||"").toLowerCase();
  if(s==="whatsapp"||t.startsWith("whatsapp")) return "WhatsApp";
  if(s==="dotmed"||t==="dotmed") return "DOTmed";
  if(s==="outlook"||t==="email") return "Email";
  if(s==="shipstation"||t==="shipment") return "Shipping";
  if(s==="paypal"||t==="payment"||t==="order") return "PayPal";
  return null; }

// ---------- pure helpers ----------
function fmtAgo(t){ if(!t) return "—"; const d=new Date(t),h=(Date.now()-d.getTime())/3.6e6; if(h<1) return Math.max(1,Math.round(h*60))+"m ago"; if(h<24) return Math.round(h)+"h ago"; return Math.round(h/24)+"d ago"; }
function fmtDate(t){ if(!t) return "—"; return new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function fmtMoney(n){ n=Number(n)||0; return "$"+n.toLocaleString(undefined,{maximumFractionDigits:0}); }
const OWNERSHIP_MONTHS = 3; // customer opens to any rep once no rep has closed a sale in over this many months
function repFirst(name){ return String(name||'').trim().split(/\s+/)[0]||''; }
function monthsAgoISO(months){ const d=new Date(); d.setMonth(d.getMonth()-months); return d.toISOString().slice(0,10); }
function lastMsg(msgs){ return msgs&&msgs.length?msgs[msgs.length-1]:null; }
function dueSoon(cu){ if(!cu.follow_up_date) return false; return new Date(cu.follow_up_date+"T23:59:59").getTime()<=Date.now(); }
function statusLabel(cu){ return statusName(cu.manager_status||"new"); }
function statusClass(cu){ const s=cu.manager_status||"new"; return ["new","in_progress","quoted","awaiting_customer","won","lost","closed"].includes(s)?s:"new"; }
function nextAction(cu,msgs){
  if(cu.next_action_override) return cu.next_action_override;
  if(["won","lost","closed"].includes(cu.manager_status)) return "No action";
  const l=lastMsg(msgs); if(l&&l.direction==="in") return "Reply to WhatsApp";
  if(dueSoon(cu)) return "Follow up (due)";
  if(cu.follow_up_date) return "Follow Up";
  return "Waiting on Customer";
}
function naClass(a){ return /reply/i.test(a)?"reply":/follow/i.test(a)?"follow":/no action/i.test(a)?"none":"wait"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
// strip the garbled HTML-entity sender names that occasionally arrive from Outlook
function cleanName(s){ if(!s) return ""; let x=String(s).replace(/&#x?[0-9a-fA-F]+;/g,"").replace(/[\u0000-\u001f]/g," ").replace(/\s+/g," ").trim(); return /[A-Za-z0-9]/.test(x)?x:""; }
function dispName(cu){ return cleanName(cu.name)||cu.email||("Customer #"+cu.id); }
const REP_BG=["#e8f1fb","#e6f6ee","#fdf3e2","#efe9fb","#d9f2ee","#f3e8ff","#fff4e5"];
const REP_BD=["#185fa5","#1b9e6b","#b7791f","#6b46c1","#0f766e","#8b5cf6","#d97706"];
function repCidx(id){ try{ const i=(STATE.reps||[]).findIndex(r=>r.id===id); return i>=0?i:0; }catch(e){ return 0; } }
function repBg(id){ return REP_BG[repCidx(id)%REP_BG.length]; }
function repBd(id){ return REP_BD[repCidx(id)%REP_BD.length]; }
function repNm(id,cu){ try{ const r=(STATE.reps||[]).find(x=>x.id===id); return r?r.name:(cu.assigned_rep||"Rep"); }catch(e){ return (cu&&cu.assigned_rep)||"Rep"; } }
function msgMeta(m,cu){ if(m.customer_id&&m.customer_id!==cu.id&&typeof STATE!=="undefined"){ const _c=(STATE.customers||[]).find(x=>x.id===m.customer_id); if(_c) cu=_c; } const cust=cleanName(cu.name)||cu.phone||"Customer"; const rep=repNm(m.rep_id,cu); const ago=fmtAgo(m.ts); if(m.direction==="in"){ return esc(cust)+" \u2192 "+esc(rep)+" · "+ago; } const via=/[a-zA-Z]/.test(String(m.sender||""))?"via CRM":"from cell"; return esc(rep)+" \u2192 "+esc(cust)+" · "+via+" · "+ago; }
function htmlToText(h){ if(!h) return "";
 h=String(h).replace(/<!--[\s\S]*?-->/g," ").replace(/<style[\s\S]*?<\/style>/gi," ").replace(/<script[\s\S]*?<\/script>/gi," ");
 if(!/[<&]/.test(h)) return h.replace(/[ \t]{2,}/g," ").trim();
 const d=document.createElement("div"); d.innerHTML=h;

function linkify(t){ return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function matchesFilters(cu,f){
  if(f.q){ const blob=(cu.name+" "+cu.company+" "+cu.phone+" "+cu.email+" "+cu.assigned_rep).toLowerCase(); if(!blob.includes(f.q.toLowerCase())) return false; }
  if(f.source && !(cu._badges||[]).includes(f.source)) return false;
  if(f.cinfo){ const he=!!(cu.email)||((cu.purchase_emails||[]).length>0); const hw=!!cu._convId;
    if(f.cinfo==="both" && !(he&&hw)) return false;
    if(f.cinfo==="waonly" && !(hw&&!he)) return false;
    if(f.cinfo==="emailonly" && !(he&&!hw)) return false; }
  if(f.rep){ if(f.rep==="__none"){ if(cu.assigned_rep) return false; } else { const _a=String(cu.assigned_rep||""),_b=String(f.rep); if(!(_a===_b||_a.indexOf(_b+" ")===0||_b.indexOf(_a+" ")===0)) return false; } }
  if(f.status && (cu.manager_status||"new")!==f.status) return false;
  if(f.priority && (cu.priority||"normal")!==f.priority) return false;
  if(f.vip && !cu.vip) return false;
  if(f.review && !cu.review_flag) return false;
  if(f.due && !dueSoon(cu)) return false; if(f.multi && !MULTIREP.has(cu.id)) return false;
  return true;
}

// Sales-rep intel: who closed sales with this customer, what they bought, last rep, and the
// 3-month ownership status (owned by a rep, or open to all reps).
function renderRepIntel(rows){
  const attr=(rows||[]).filter(r=>r.rep && String(r.rep).trim());
  if(!attr.length) return '';
  const byRep={}, seen={};
  attr.forEach(r=>{
    const rp=r.rep.trim(); const g=byRep[rp]||(byRep[rp]={rep:rp,orders:new Set(),items:{},last:'',rev:0});
    const on=String(r.order_number||r.invoice||('d'+(r.order_date||'')));
    g.orders.add(on);
    const ok=rp+'|'+on; if(!seen[ok] && r.order_total!=null && r.order_total!==''){ seen[ok]=1; g.rev+=Number(r.order_total)||0; }
    const it=(r.item||'').split(/[-–]/)[0].trim().slice(0,46); if(it) g.items[it]=(g.items[it]||0)+(Number(r.qty)||1);
    const d=(r.order_date||'').slice(0,10); if(d>g.last) g.last=d;
  });
  const reps=Object.values(byRep).sort((a,b)=>(b.last||'').localeCompare(a.last||''));
  const lastRep=reps[0].rep, lastDate=reps[0].last;
  const cutoff=monthsAgoISO(OWNERSHIP_MONTHS);
  const open=!(lastDate && lastDate>=cutoff);
  let badge;
  if(open){
    badge='<span style="background:#e8f5ec;color:#1d7a3f;border:1px solid #b7e0c4;border-radius:10px;padding:1px 8px;font-weight:700;font-size:11px">🔓 OPEN to all reps</span> <span style="color:var(--muted);font-size:11px">no rep has closed a sale in over '+OWNERSHIP_MONTHS+' months — anyone can work this account</span>';
  }else{
    const exp=new Date(lastDate); exp.setMonth(exp.getMonth()+OWNERSHIP_MONTHS);
    const dl=Math.max(0,Math.ceil((exp-Date.now())/86400000));
    badge='<span style="background:#eaf3fd;color:#0b66c3;border:1px solid #bcd8f5;border-radius:10px;padding:1px 8px;font-weight:700;font-size:11px">🔒 '+esc(lastRep)+' owns this account</span> <span style="color:var(--muted);font-size:11px">'+dl+' day'+(dl===1?'':'s')+' left unless another closed sale resets it</span>';
  }
  let h='<div style="border:1px solid #dbe6f0;background:#f7fbff;border-radius:10px;padding:10px 12px;margin:0 0 12px">';
  h+='<div style="font-size:13px;margin-bottom:4px">🏅 Last sale: <b>'+esc(lastRep)+'</b> · '+esc(lastDate||'—')+'</div>';
  h+='<div style="margin-bottom:6px">'+badge+'</div>';
  h+='<table class="phtab"><thead><tr><th>Rep who closed sales</th><th>Orders</th><th>Last sale</th><th>Revenue</th><th>Top items bought</th></tr></thead><tbody>';
  reps.forEach(g=>{ const tops=Object.keys(g.items).sort((a,b)=>g.items[b]-g.items[a]).slice(0,3).map(esc).join(', ');
    h+='<tr><td><b>'+esc(g.rep)+'</b></td><td>'+g.orders.size+'</td><td class="nowrap">'+esc(g.last||'')+'</td><td>'+(g.rev?fmtMoney(g.rev):'—')+'</td><td>'+tops+'</td></tr>'; });
  h+='</tbody></table></div>';
  return h;
}

function renderShipTo(rows){

  if(!withLoc.length) return '';
  withLoc.sort((a,b)=>String(b.order_date||'').localeCompare(String(a.order_date||'')));

  const more=uniq.length>1?(' <span style="color:var(--muted);font-size:11px">(+'+(uniq.length-1)+' other ship-to location'+(uniq.length-1===1?'':'s')+')</span>'):'';

async function suggestFor(email, purchaseRows){
  const NK=x=>String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const bought=(purchaseRows||[]).map(r=>NK(r.item)).filter(Boolean);
  const has=tok=>tok&&tok.length>=4&&bought.some(t=>t.includes(tok));
  const mfgs=[...new Set((purchaseRows||[]).map(r=>{ const m=(r.item||'').trim().match(/^[A-Za-z0-9][A-Za-z0-9&.\-]*/); return m?m[0].replace(/[*,()]/g,'').toUpperCase():''; }).filter(w=>w&&w.length>=2))].slice(0,10);
  email=(email||'').toLowerCase().trim();
  const lastBought=ref=>{ const k=NK(ref); if(!k||k.length<4) return ''; let best=''; (purchaseRows||[]).forEach(r=>{ if(NK(r.item).includes(k)){ const d=String(r.order_date||'').slice(0,10); if(d>best) best=d; } }); return best; };
  let dm=[];
  if(mfgs.length){ try{ const orf=mfgs.map(m=>'mfg.ilike.'+m+'*').join(','); const {data}=await SB.from('listings').select('account,mfg,model,name,category,price,url').or(orf).eq('in_stock',true).limit(500); dm=(data||[]).filter(x=>has(NK(x.model))).map(x=>({source:x.account||'SurgaMed',inDate:(x.account!=='SurgaMed'),name:x.name||((x.mfg||'')+' '+(x.model||'')).trim(),ref:x.model,category:x.category,price:x.price,url:x.url,lastBought:lastBought(x.model)})); }catch(e){} }
  let ms=[];
  if(email){ try{ const pbi=await SB.from('purchase_brand_index').select('brand_key').eq('customer_email',email); const bks=[...new Set((pbi.data||[]).map(b=>b.brand_key))]; if(bks.length){ const {data}=await SB.from('medstock_inventory').select('manufacturer,ref,ref_key,description,category').eq('active',true).in('mfg_key',bks).limit(500); ms=(data||[]).filter(x=>has(x.ref_key)).map(x=>({source:'Medstock',inDate:true,name:x.description||((x.manufacturer||'')+' '+(x.ref||'')).trim(),ref:x.ref,category:x.category,price:null,url:null,lastBought:lastBought(x.ref_key)})); } }catch(e){} }
  let exact=dm.concat(ms); const seen={}; exact=exact.filter(x=>{const k=x.source+'|'+NK(x.ref); if(seen[k])return false; seen[k]=1; return true;});
  exact.sort((a,b)=>String(b.lastBought||'').localeCompare(String(a.lastBought||''))||(b.inDate-a.inDate));
  let similar=[]; const er=new Set(exact.map(x=>NK(x.ref)));
  try{
    const stop=new Set(['MEDICAL','SURGICAL','SINGLE','STERILE','DISPOSABLE','SYSTEM','DEVICE','LARGE','SMALL','WHITE','GREEN','BLACK','ADULT','PEDIATRIC','LATEX']);
    const kws=[...new Set((purchaseRows||[]).flatMap(r=>String(r.item||'').split(/[^A-Za-z]+/).filter(w=>w.length>=5&&!/^\d+$/.test(w)).map(w=>w.toUpperCase())))].filter(w=>!mfgs.includes(w)&&!stop.has(w)).slice(0,8);
    const ors=[]; mfgs.slice(0,6).forEach(m=>ors.push('mfg.ilike.'+m+'*')); kws.forEach(k=>{ ors.push('name.ilike.*'+k+'*'); ors.push('category.ilike.*'+k+'*'); });
    let pool=[];
    if(ors.length){ const {data}=await SB.from('listings').select('account,mfg,model,name,category,price,url').or(ors.join(',')).eq('in_stock',true).limit(150);
      pool=pool.concat((data||[]).map(x=>({source:x.account||'SurgaMed',inDate:(x.account!=='SurgaMed'),name:x.name||((x.mfg||'')+' '+(x.model||'')).trim(),ref:(x.model||NK(x.name)),category:x.category,price:x.price,url:x.url}))); }
    try{ const orm=[]; mfgs.slice(0,6).forEach(m=>orm.push('manufacturer.ilike.'+m+'*')); kws.forEach(k=>{ orm.push('description.ilike.*'+k+'*'); orm.push('category.ilike.*'+k+'*'); });
      if(orm.length){ const {data}=await SB.from('medstock_inventory').select('manufacturer,ref,ref_key,description,category,quantity,exp_date').eq('active',true).or(orm.join(',')).limit(150);
        pool=pool.concat((data||[]).map(x=>({source:'Medstock',inDate:true,name:x.description||((x.manufacturer||'')+' '+(x.ref||'')).trim(),ref:(x.ref||NK(x.description)),category:x.category,price:null,url:null}))); } }catch(e){}
    pool=pool.filter(x=>x.name&&x.ref&&!er.has(NK(x.ref)));
    const s2={}; pool=pool.filter(x=>{const k=NK(x.name); if(!k||s2[k])return false; s2[k]=1; return true;});
    pool.sort((a,b)=>(b.inDate-a.inDate)); pool=pool.slice(0,50);
    similar=pool.slice(0,15);
    if(pool.length){ try{ const _bn=(purchaseRows||[]).map(r=>r.item).filter(Boolean).slice(0,25); const _rr=await fetch(SB_URL+'/functions/v1/similar-items',{method:'POST',headers:{'content-type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+(await freshToken())},body:JSON.stringify({bought:_bn,candidates:pool.map(x=>({ref:x.ref,name:x.name,category:x.category,source:x.source}))})}); if(_rr.ok){ const _dd=await _rr.json(); if(_dd.items&&_dd.items.length){ const _br={}; pool.forEach(x=>_br[String(x.ref)]=x); similar=_dd.items.map(p=>Object.assign({},_br[String(p.ref)]||{},{reason:p.reason})).filter(x=>x.ref); } } }catch(e){} }
  }catch(e){}

async function sendCustEmail(ns, to, name){
  to=(to||'').trim(); const body=document.getElementById(ns+'_body'), msg=document.getElementById(ns+'_msg'), subjEl=document.getElementById(ns+'_subj');
  if(!body) return; const text=(body.value||'').trim(); if(!text){ body.focus(); return; }
  if(!to){ if(msg){msg.style.color='var(--red)'; msg.textContent='No email on file.';} return; }
  const subj=((subjEl&&subjEl.value)||'').trim()||'SurgaMed — following up';
  if(!confirm('Send this email to '+to+'? Sends from your inbox.')) return;
  if(msg){msg.style.color='var(--muted)'; msg.textContent='Sending…';}
  try{
    if(!STATE.live){ body.value=''; if(msg){msg.style.color='var(--green)'; msg.textContent='Sent ✓ (demo)';} return; }
    const rep=((STATE.email||'').split('@')[0]);
    const payload={action:'send',attachments:(window.__ATT_LIST||[]),rep,to,subject:subj,text,from:''};
    const r=await fetch(FN_URL,{method:'POST',headers:{Authorization:'Bearer '+(await freshToken()),apikey:SB_KEY,'content-type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json(); if(!r.ok||d.error) throw new Error(d.error||('HTTP '+r.status));
    try{ await SB.from('contacts').insert({customer_email:to.toLowerCase(),customer_name:name||null,rep,rep_email:STATE.email||null,channel:'email',direction:'out',subject:subj,message_id:'crm-'+Date.now()}); }catch(_){}
    body.value=''; if(msg){msg.style.color='var(--green)'; msg.textContent='Sent ✓';}
  }catch(e){ if(msg){msg.style.color='var(--red)'; msg.textContent='Couldn’t send: '+String(e.message||e);} }
}

function toggleSection(hdr){
  const collapsed=!(hdr.getAttribute('data-collapsed')==='1');
  hdr.setAttribute('data-collapsed',collapsed?'1':'0');
  let el=hdr.nextElementSibling;
  while(el && !/^H[1-6]$/.test(el.tagName)){ el.style.display=collapsed?'none':''; el=el.nextElementSibling; }
  const car=hdr.querySelector('.gcar'); if(car) car.textContent=collapsed?'▸':'▾';
}
function initCollapsibles(root,sel){
  if(!root) return;
  root.querySelectorAll(sel||'h3.sec').forEach(function(hdr){
    if(hdr.dataset.cinit) return; hdr.dataset.cinit='1';
    hdr.style.cursor='pointer'; hdr.style.userSelect='none';
    const car=document.createElement('span'); car.className='gcar'; car.textContent='▾';
    car.style.cssText='margin-right:5px;font-size:11px;color:var(--muted);display:inline-block';
    hdr.insertBefore(car,hdr.firstChild);
    hdr.addEventListener('click',function(){ toggleSection(hdr); });
  });
}

async function callFn(action,payload){
  const { data:{ session } }=await SB.auth.getSession();
  const r=await fetch(MANAGER_FN,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+(session&&session.access_token||"")},body:JSON.stringify({action,...payload})});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||("HTTP "+r.status)); return j;
}
function localNote(cu,title,body){ (cu._tl=cu._tl||[]).unshift({type:"note",source:"manager",rep:(STATE.email||"demo"),title,body,ts:new Date().toISOString()}); }
async function mgrAction(cu,action,payload){
  try{
    if(STATE.live){ await callFn(action,{customer_id:cu.id,...payload}); }
    if(action==="assign_rep"){ const rep=STATE.reps.find(r=>r.id===payload.rep_id); cu.assigned_rep=rep?rep.name:""; localNote(cu,"Assigned to "+(rep?rep.name:"unassigned")); }
    if(action==="set_status"){ cu.manager_status=payload.manager_status; localNote(cu,"Status → "+statusName(payload.manager_status)); }
    if(action==="set_priority"){ cu.priority=payload.priority; localNote(cu,"Priority → "+payload.priority); }
    if(action==="set_follow_up"){ cu.follow_up_date=payload.follow_up_date||null; localNote(cu,payload.follow_up_date?"Follow-up set for "+payload.follow_up_date:"Follow-up cleared"); }
    if(action==="set_next_action"){ cu.next_action_override=payload.next_action_override||null; localNote(cu,payload.next_action_override?"Next action: "+payload.next_action_override:"Next action cleared (auto)"); }
    if(action==="toggle_vip"){ cu.vip=payload.vip; localNote(cu,payload.vip?"Marked VIP":"VIP removed"); }
    if(action==="toggle_review"){ cu.review_flag=payload.review_flag; localNote(cu,payload.review_flag?"Flagged for review":"Review flag cleared"); }

<script>
(function(){
  window.__ATT_LIST = window.__ATT_LIST || [];
  var MAXTOTAL = 4*1024*1024;
  function fmtSize(n){ return n<1024?n+'B':(n<1048576?(Math.round(n/1024)+'KB'):((n/1048576).toFixed(1)+'MB')); }
  function readAll(files, cb){
    var out=[], pending=files.length; if(!pending)return cb([]);
    files.forEach(function(f){
      var fr=new FileReader();
      fr.onload=function(){ var b64=String(fr.result||'').split(',')[1]||''; out.push({name:f.name, contentType:f.type||'application/octet-stream', contentBytes:b64, _size:f.size}); if(--pending===0)cb(out); };
      fr.onerror=function(){ if(--pending===0)cb(out); };
      fr.readAsDataURL(f);
    });
  }
  function makeControl(sendBtn){
    if(sendBtn.__attached) return; sendBtn.__attached=true;
    var wrap=document.createElement('span'); wrap.style.cssText='display:inline-flex;align-items:center;gap:6px;margin-right:8px;flex-wrap:wrap';
    var input=document.createElement('input'); input.type='file'; input.multiple=true; input.style.display='none';
    var btn=document.createElement('button'); btn.type='button'; btn.textContent='📎 Attach'; btn.style.cssText='padding:7px 12px;background:#eef2f7;color:#33506e;border:1px solid #ccd6e0;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px';
    var chips=document.createElement('span'); chips.style.cssText='display:inline-flex;gap:5px;flex-wrap:wrap';
    btn.onclick=function(){ input.click(); };
    function render(){
      chips.innerHTML='';
      (window.__ATT_LIST||[]).forEach(function(a,idx){
        var c=document.createElement('span'); c.style.cssText='background:#e8eef5;border-radius:10px;padding:2px 8px;font-size:11px;display:inline-flex;align-items:center;gap:4px';
        c.appendChild(document.createTextNode(a.name+' ('+fmtSize(a._size||0)+')'));
        var x=document.createElement('span'); x.textContent='×'; x.style.cssText='cursor:pointer;font-weight:700;color:#c0392b'; x.onclick=function(){ window.__ATT_LIST.splice(idx,1); render(); };
        c.appendChild(x); chips.appendChild(c);
      });
    }
    input.onchange=function(){
      var files=Array.prototype.slice.call(input.files||[]);
      readAll(files, function(newAtts){
        window.__ATT_LIST=(window.__ATT_LIST||[]).concat(newAtts);
        var total=window.__ATT_LIST.reduce(function(s,a){return s+(a._size||0);},0);
        if(total>MAXTOTAL){ alert('Attachments total '+fmtSize(total)+'. Large attachments (over ~4MB) may be rejected by the mail server — consider a download link instead.'); }
        render(); input.value='';
      });
    };
    wrap.appendChild(btn); wrap.appendChild(chips); wrap.appendChild(input);
    sendBtn.parentNode.insertBefore(wrap, sendBtn);
    sendBtn.addEventListener('click', function(){ setTimeout(function(){ window.__ATT_LIST=[]; render(); }, 2500); });
    window.__attRender = render;
  }
  try{
    new MutationObserver(function(){
      var btns=[].slice.call(document.querySelectorAll('button')).filter(function(b){ return /Send from board|Send email/i.test((b.textContent||'')) && !b.__attached; });
      btns.forEach(makeControl);
    }).observe(document.body,{childList:true,subtree:true});
  }catch(e){}
})();
</script>
